# Site settings
title: Thermo-Fluids & Energy Systems (TFES) Research Group | TU Dublin
tagline: >
  Researching thermo-fluid dynamics, data centre cooling,
  microfluidics, and energy systems for a sustainable future.
email: sajad.alimohammadi@tudublin.ie
description: >
  The Thermo-Fluids and Energy Systems (TFES) Research Group
  is based at Technological University Dublin, led by
  Dr Sajad Alimohammadi. The group conducts computational
  and experimental research in thermo-fluid dynamics,
  data centre thermal management, synthetic jets,
  microfluidics, and energy systems.
baseurl: ""
url: "https://www.thermo-fluidsgroup.com"
lang: en_GB

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins:
  - jekyll-seo-tag
